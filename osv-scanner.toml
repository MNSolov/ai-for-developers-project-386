# osv-scanner findings that cannot be fixed in this repository today.
#
# osv-scanner only auto-loads an osv-scanner.toml sitting next to a lockfile, so
# this single root file is applied to every lockfile through the explicit flag:
#   mise run vuln   (osv-scanner scan source --recursive --allow-no-lockfiles
#                    --config osv-scanner.toml .)
#
# All 24 entries are in DEV dependency trees of the two applications and arrive
# through transitive pins their owners control:
#   - api: 23 advisories under @nestjs/mau@0.2.9 (the Hexlet deploy CLI):
#       21 x undici@6.20.1 (exact pin by mau) and 2 x tmp@0.0.33
#         (mau -> inquirer 8.2.6 -> external-editor)
#   - client: 1 advisory, minimatch@10.2.6 (eslint-config-next ->
#       typescript-eslint chain; fix is a minimatch 11 major bump)
#
# Policy: every entry carries an effectiveUntil review date. When it passes,
# osv-scanner reports the finding again and `mise run vuln` fails, forcing a
# fresh decision: bump, override, or re-review. Entries must shrink, not grow.
#
# Regenerate the ID list with:
#   mise exec -- osv-scanner scan source --recursive --allow-no-lockfiles --format json .

